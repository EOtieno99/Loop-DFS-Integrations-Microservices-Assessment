spring.application.name=Loop_Assessment

# Database Properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loop_assessment}
spring.datasource.username=${DB_USERNAME:loop}
spring.datasource.password=${DB_PASSWORD:TestLoopDFS}

# Db connection pooling properties
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.pool-name=CountryDbPool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Db Migration Properties
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Tomcat Server Properties
server.tomcat.threads.max=100
server.tomcat.accept-count=100
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=8KB

# Management server properties
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Logging Properties
logging.structured.format.console=logstash
country.soap.endpoint=${SOAP_ENDPOINT:http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso}
country.soap.connect-timeout=2s
country.soap.request-timeout=4s
country.soap.max-attempts=3
country.soap.retry-wait=200ms
country.soap.open-wait=30s
country.soap.max-concurrent-calls=20
