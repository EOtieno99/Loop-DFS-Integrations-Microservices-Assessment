apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: country-api
  namespace: loop-assessment
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: country-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: country-api
  namespace: loop-assessment
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: country-api
