apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: country-api-ingress
  namespace: loop-assessment
spec:
  podSelector:
    matchLabels:
      app: country-api
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              access-country-api: "true"
    - ports:
        - port: 8081
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-ingress
  namespace: loop-assessment
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: country-api
      ports:
        - port: 3306
